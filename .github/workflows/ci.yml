name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm test
      - run: npm ci --prefix plugins/dsh-personal-assistant
      - run: npm run check --prefix plugins/dsh-personal-assistant
      - run: npm run build --prefix plugins/dsh-personal-assistant
      - run: npm test --prefix plugins/dsh-personal-assistant
      - run: npm run test:package --prefix plugins/dsh-personal-assistant
