name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm test
      - run: npm run release:check
      - run: npm ci
        working-directory: plugins/dsh-personal-assistant
      - run: npm run build
        working-directory: plugins/dsh-personal-assistant
      - run: npm test
        working-directory: plugins/dsh-personal-assistant
      - run: npm run release:pack
      - run: npm run test:package -- ../../dist/release/dsh-personal-assistant.tgz
        working-directory: plugins/dsh-personal-assistant
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm run release:check
      - run: npm ci
        working-directory: plugins/dsh-personal-assistant
      - run: npm run build
        working-directory: plugins/dsh-personal-assistant
      - run: npm run release:pack
      - name: Verify the packed installable plugin
        run: npm run test:package -- ../../dist/release/dsh-personal-assistant.tgz
        working-directory: plugins/dsh-personal-assistant
      - run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
